<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mystic Quest ROM Inspector</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a href="#main" class="skip-link">Zum Inhalt springen</a>

<div id="topbar">
  <button id="sidebarToggle" type="button" aria-label="Navigation öffnen" aria-expanded="false" aria-controls="sidebar">☰</button>
  <div class="brand"><span class="dot"></span> ROM Inspector</div>
  <div class="subtitle">Mystic Quest (Game Boy, EU) &mdash; interaktive Reverse-Engineering-Dokumentation</div>
  <div class="spacer"></div>
  <div id="paletteControl">
    <label for="paletteSelect" class="palette-label" title="Anzeige-Farbschema für alle Kachel-Grafiken auf dieser Seite -- eine reine Darstellungsoption, keine ROM-Daten.">🎨</label>
    <select id="paletteSelect" aria-label="Farbschema für Kachel-Grafiken"></select>
  </div>
  <div id="romLoadControl">
    <label class="btn primary small" for="romFileInput" id="romLoadLabel">📂 ROM laden&hellip;</label>
    <input id="romFileInput" type="file" accept=".gb" class="visually-hidden">
    <span id="romLoadStatus" class="romload-status" role="status"></span>
  </div>
  <label for="globalSearch" class="visually-hidden">Suche über Opcodes, Adressen und Begriffe</label>
  <input id="globalSearch" type="search" placeholder="Suche (Opcode, Adresse, Begriff)&hellip;">
</div>

<div id="sidebarBackdrop"></div>

<div id="shell">
  <nav id="sidebar" aria-label="Hauptnavigation"></nav>
  <main id="main" tabindex="-1"></main>
</div>

<!-- Real, generated + curated data (see rom-inspector/tools/export_data.lua) -->
<script src="js/data/rom-basics.js"></script>
<script src="js/data/rom-tables.js"></script>
<script src="js/data/bank-notes.js"></script>
<script src="js/data/entity-struct.js"></script>
<script src="js/data/opcodes.js"></script>
<script src="js/data/control-codes.js"></script>
<script src="js/data/script-example.js"></script>
<script src="js/data/scan-results.js"></script>
<script src="js/data/rooms.js"></script>
<script src="js/data/room-maps.js"></script>
<script src="js/data/room-catalog.js"></script>
<script src="js/data/font-tileset.js"></script>
<script src="js/data/text-decoder.js"></script>
<script src="js/data/wram-map.js"></script>
<script src="js/data/open-questions.js"></script>
<script src="js/data/opcode-descriptions.js"></script>
<script src="js/data/monsters.js"></script>
<script src="js/data/graphics-candidates.js"></script>
<script src="js/data/map-tile-catalog.js"></script>
<script src="js/data/items.js"></script>
<script src="js/data/npcs.js"></script>
<script src="js/data/story.js"></script>
<script src="js/data/music.js"></script>
<script src="js/data/transitions.js"></script>
<script src="js/data/actors.js"></script>

<!-- Local-only ROM loading + GB tile decode (never uploaded anywhere) -->
<script src="js/rombytes.js"></script>

<!-- Visualization modules -->
<script src="js/viz/overview.js"></script>
<script src="js/viz/memory.js"></script>
<script src="js/viz/entity.js"></script>
<script src="js/viz/opcodes.js"></script>
<script src="js/viz/scan.js"></script>
<script src="js/viz/rooms.js"></script>
<script src="js/viz/text.js"></script>
<script src="js/viz/music.js"></script>
<script src="js/viz/tables.js"></script>
<script src="js/viz/questions.js"></script>
<script src="js/viz/tiles.js"></script>
<script src="js/viz/mapviewer.js"></script>
<script src="js/viz/worldmap.js"></script>
<script src="js/viz/monsters.js"></script>
<script src="js/viz/graphics.js"></script>
<script src="js/viz/items.js"></script>
<script src="js/viz/npcs.js"></script>
<script src="js/viz/story.js"></script>
<script src="js/viz/transitions.js"></script>
<script src="js/viz/actors.js"></script>

<!-- Routing / shell -->
<script src="js/app.js"></script>
</body>
</html>
